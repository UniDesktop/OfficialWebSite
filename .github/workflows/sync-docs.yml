# Keeps the documentation in this repository in step with the docs repository.
#
# Why this exists: the website hosts the documentation itself rather than
# linking out, because the site is served from unidesktop.sr-studio.cn and
# sending readers to a different domain to read the docs is worse than hosting
# them. The cost of hosting a copy is drift, and this workflow is what pays it
# down — scheduled, and openable by hand from the Actions tab.
#
# The upstream repository is public, so cloning it needs no secret. The pull
# request is opened with the run's own GITHUB_TOKEN, which also means the
# default `contents: write` / `pull-requests: write` permissions are enough.
#
# Note: a pull request opened with GITHUB_TOKEN does not trigger other
# workflows (GitHub suppresses that to avoid recursion). Nothing depends on it
# today, but if a `pull_request` check is added later it will not run on the
# sync PRs and the build step below is the only verification.
name: Sync documentation

on:
  schedule:
    # 03:17 UTC daily. Off the hour on purpose: scheduled runs queued at :00
    # are the ones GitHub is most likely to delay.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-docs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync documentation from unidesktop.github.io
        id: sync
        run: node scripts/sync-docs.mjs

      - name: Did anything move?
        id: drift
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Documentation already in sync."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short
          fi

      # Verify before proposing. A docs sync that breaks the build should fail
      # here rather than land in a pull request that looks ready to merge.
      #
      # `npm install` rather than `npm ci`: the repository tracks
      # pnpm-lock.yaml, not package-lock.json, so there is no lockfile for
      # `npm ci` to check against. The project README documents this fallback.
      - name: Install dependencies
        if: steps.drift.outputs.changed == 'true'
        run: npm install --package-lock=false --no-audit --no-fund

      - name: Build the site
        if: steps.drift.outputs.changed == 'true'
        run: npm run build

      - name: Open a pull request
        if: steps.drift.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B chore/sync-docs
          git add -A
          git commit -m "docs: sync from unidesktop.github.io

          Generated by .github/workflows/sync-docs.yml.
          The upstream commit is recorded in src/content/docs/.sync-state.json."

          git push --force origin chore/sync-docs

          gh pr create \
            --base main \
            --head chore/sync-docs \
            --title "docs: sync from the documentation repository" \
            --body "$(printf '%s\n' \
              'The scheduled sync found documentation changes upstream.' \
              '' \
              '**Review the diff before merging** — the sync also re-applies the' \
              'local rewrites (the `/zh-cn` link prefix), the local-only pages in' \
              '`docs-overrides/`, and the de-duplication fixes. Those should not' \
              'show up as changes unless upstream moved something.' \
              '' \
              'Upstream commit: see `src/content/docs/.sync-state.json`.' \
              '' \
              'The build was run in this workflow before the pull request was opened.')" \
            || echo "A pull request for chore/sync-docs is already open; the branch was updated."
